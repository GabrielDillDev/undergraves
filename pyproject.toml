[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "undergraves"
version = "0.1.0"
description = "Command-line web crawler for domain mapping and endpoint discovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
undergraves = "undergraves.cli:run"